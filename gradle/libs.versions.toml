[versions]
agp = "8.5.0-rc02"
kotlin = "1.9.0"
coreKtx = "1.13.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.13.0"
googleServices = "4.4.2"
firebaseBom = "32.7.4"
koin = "3.5.6"
navigation = "2.7.7"
lifecycle = "2.7.0"
activityKtx = "1.9.0"
fragmentKtx = "1.7.1"
rxjava3 = "3.1.8"
rxkotlin = "3.0.1"
rxandroid = "3.0.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
